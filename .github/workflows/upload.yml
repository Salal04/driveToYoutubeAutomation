name: InstaUploaderPipeline

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch: {}       # allows manual "Run workflow" button too

permissions:
  contents: write            # needed to commit the updated ledger back

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: insta-uploader-pipeline
      cancel-in-progress: false   # never run two uploads at once (would break sequencing)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > service_account.json

      - name: Run pipeline
        env:
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
        run: python main.py

      - name: Remove secret file before commit
        if: always()
        run: rm -f service_account.json

      - name: Commit updated upload ledger
        if: always()
        run: |
          git config user.name "insta-uploader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add records/upload_record.json
          git diff --cached --quiet || git commit -m "Update upload ledger [skip ci]"
          git push
