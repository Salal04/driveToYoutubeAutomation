name: InstaUploaderPipeline

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch: {}       # allows manual "Run workflow" button too

permissions:
  contents: write            # needed to commit the updated ledger back

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: insta-uploader-pipeline
      cancel-in-progress: false   # never run two uploads at once (would break sequencing)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Write Google service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Validate service account key is well-formed JSON
        run: python -c "import json; json.load(open('service_account.json'))" && echo "service_account.json is valid JSON"

      - name: Run pipeline
        env:
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          MAX_UPLOADS_PER_RUN: ${{ vars.MAX_UPLOADS_PER_RUN || '1' }}
        run: python main.py

      - name: Remove secret file before commit
        if: always()
        run: rm -f service_account.json

      - name: Commit updated upload ledger
        if: always()
        run: |
          git config user.name "insta-uploader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add records/upload_record.json

          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
            exit 0
          fi

          git commit -m "Update upload ledger [skip ci]"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push attempt $i failed, retrying in a few seconds..."
            sleep $((RANDOM % 5 + 2))
          done

          echo "Failed to push ledger after multiple retries."
          exit 1
